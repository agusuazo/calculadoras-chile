name: Actualizar indicadores y feriados
on:
  schedule:
    - cron: "0 12 * * *" # diario, 09:00 hora Chile aprox.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.mjs && node scripts/build.mjs
      - name: Commit si hay cambios
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Actualiza datos $(date -u +%F)" && git push)

